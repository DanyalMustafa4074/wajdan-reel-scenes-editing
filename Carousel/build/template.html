<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Anton';src:url(__ANTON__) format('truetype');font-weight:400;}
@font-face{font-family:'Baloo';src:url(__BALOO__) format('truetype');font-weight:800;}

:root{
  --cream:#F4ECD8;
  --cream2:#EFE6CF;
  --navy:#162447;
  --gold:#F4A417;      /* fresh marigold */
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;}
.slide{
  position:relative;width:1080px;height:1350px;overflow:hidden;
  background:radial-gradient(120% 90% at 45% 6%, #FBF5E6 0%, var(--cream) 48%, var(--cream2) 100%);
  font-family:'Anton',sans-serif;
}
.grain{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;
  background-image:radial-gradient(rgba(22,36,71,.05) 1px,transparent 1px);
  background-size:6px 6px;pointer-events:none;z-index:2;}

/* giant tiled hook word watermark */
.tile{position:absolute;inset:-8%;z-index:1;}
.tile svg{width:100%;height:100%;}

/* subject */
.subject{
  position:absolute;bottom:-8px;right:-66px;height:880px;z-index:6;
  filter:
    grayscale(1) contrast(1.07) brightness(1.02)
    drop-shadow(0 6px 0 var(--gold)) drop-shadow(0 -6px 0 var(--gold))
    drop-shadow(6px 0 0 var(--gold)) drop-shadow(-6px 0 0 var(--gold))
    drop-shadow(4px 4px 0 var(--gold)) drop-shadow(-4px 4px 0 var(--gold))
    drop-shadow(4px -4px 0 var(--gold)) drop-shadow(-4px -4px 0 var(--gold));
}

/* headline — HUGE, fills the whole frame top-to-bottom (WB style) */
.hl{
  position:absolute;font-family:'Baloo',sans-serif;color:var(--navy);
  text-transform:uppercase;line-height:.88;letter-spacing:-2px;z-index:5;white-space:nowrap;
}
.pop{
  color:var(--gold);
  -webkit-text-stroke:6px var(--navy);paint-order:stroke fill;
  text-shadow:0 8px 0 rgba(22,36,71,.16);
}

/* doodle underline under the gold word */
.uline{position:absolute;z-index:4;}

/* doodle exclamation marks (WB-style personality) */
.bang{position:absolute;z-index:4;}
</style>
</head>
<body>
<div class="slide">
  <!-- tiled watermark word -->
  <div class="tile">
    <svg viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="wm" width="560" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)">
          <text x="0" y="150" font-family="Anton" font-size="150" fill="#162447" fill-opacity="0.055">WHY</text>
          <text x="280" y="300" font-family="Anton" font-size="150" fill="#162447" fill-opacity="0.055">WHY</text>
        </pattern>
      </defs>
      <rect width="1080" height="1350" fill="url(#wm)"/>
    </svg>
  </div>

  <div class="grain"></div>

  <!-- headline: HUGE, stacked down the full frame -->
  <div class="hl"     style="left:64px;top:52px;font-size:108px">THE</div>
  <div class="hl pop" style="left:56px;top:150px;font-size:240px">MISTAKE</div>
  <div class="hl"     style="left:64px;top:452px;font-size:120px">EVERY</div>
  <div class="hl"     style="left:64px;top:582px;font-size:150px">STUDENT</div>
  <div class="hl"     style="left:64px;top:806px;font-size:196px">MAKES</div>

  <!-- doodle underline under MAKES -->
  <svg class="uline" style="left:74px;top:990px;width:540px;height:46px" viewBox="0 0 540 46" xmlns="http://www.w3.org/2000/svg">
    <path d="M8 26 C150 10, 420 10, 552 22" stroke="#F4A417" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M22 40 C180 26, 430 26, 540 35" stroke="#F4A417" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.6"/>
  </svg>

  <!-- subject -->
  <img class="subject" src="__CUTOUT__" alt="Ahsan">
</div>
</body>
</html>
